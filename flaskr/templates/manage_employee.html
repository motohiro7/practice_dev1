<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>従業員管理</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
</head>
<body>
    <header>
        <div class="navbar">
            <img src="{{ url_for('static', filename='images/licon_logo.png') }}" alt="company-logo">
            <div class="logo"><a href="{{ url_for('hello') }}">ホーム</a></div>
            <nav>
                <ul>
                    <li><a href="{{ url_for('manage_employee') }}">従業員管理</a></li>
                    <li><a href="{{ url_for('register_employee') }}">従業員登録</a></li>
                    <li><a href="{{ url_for('bmi') }}">BMI診断</a></li>
                </ul>
            </nav>
        </div>
    </header>
    <section class="container mt-4">
        <h1>従業員一覧</h1>
        <table class="table table-striped mt-3">
            <thead class="table-light">
                <tr>
                    <th>#</th>
                    <th>名前</th>
                    <th>メール</th>
                    <th>リモート状況</th>
                    <th>部署</th>
                    <th>勤続年数</th>
                </tr>
            </thead>
            <tbody>
                {% for employee in employees %}
                <tr>
                    <td>{{ employee.id }}</td>
                    <td>{{ employee.name }}</td>
                    <td>{{ employee.email }}</td>
                    <td>{{ employee.remote }}</td>
                    <td>{{ employee.department }}</td>
                    <td>{{ employee.years }}</td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
        </table>
    </section>
    <footer>
        <img src="{{ url_for('static', filename='images/nekopoke.png') }}" alt="固定画像" class="fixed-image">
    </footer>
</html>
