<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>従業員登録</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
</head>
<body>
    <header>
        <div class="navbar">
            <img src="{{ url_for('static', filename='images/licon_logo.png') }}" alt="company-logo">
            <div class="logo"><a href="{{ url_for('hello') }}">ホーム</a></div>
            <nav>
                <ul>
                    <li><a href="{{ url_for('manage_employee') }}">従業員管理</a></li>
                    <li><a href="{{ url_for('register_employee') }}">従業員登録</a></li>
                    <li><a href="{{ url_for('bmi') }}">BMI診断</a></li>
                </ul>
            </nav>
        </div>
    </header>
    <section class="new-register">
        <h1>新規登録ページ</h1>
        <form action="/register_employee" method="post">
            <div class="form-group">
                <label for="name">名前</label>
                <input type="text" id="name" name="name" placeholder="名前" required>
            </div>
            <div class="form-group">
                <label for="email">メールアドレス</label>
                <input type="email" id="email" name="email" placeholder="メールアドレス"　required>
            </div>
            <div class="form-group">
                <label>リモート状況</label><br>
                <input type="radio" id="onsite" name="remote_status" value="出社" checked>
                <label for="onsite">出社</label>
                <input type="radio" id="remote" name="remote_status" value="リモート">
                <label for="remote">リモート</label>
            </div>
            <div class="form-group">
                <label for="department">部署</label>
                <input type="text" id="department" name="department" placeholder="部署">
            </div>
            <div class="form-group">
                <label for="years">勤続年数</label>
                <input type="number" id="years" name="years" placeholder="勤続年数">
            </div>
            <div class="form-group">
                <button type="submit">従業員追加</button>
            </div>
        </form>
    </section>
</body>
</html>
